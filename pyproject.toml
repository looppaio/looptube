[project]
name = "looptube"
version = "0.1.0"
description = ""
authors = [
    {name = "eneyi",email = "ruth.ikwu@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic (>=2.11.7,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "playwright (>=1.54.0,<2.0.0)",
    "google-cloud (>=0.34.0,<0.35.0)",
    "click (>=8.2.1,<9.0.0)",
    "ruff (>=0.12.10,<0.13.0)",
    "fake-useragent (>=2.2.0,<3.0.0)",
    "polyfactory (>=2.22.2,<3.0.0)",
    "pyquery (>=2.0.1,<3.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "yt-dlp (>=2025.8.22,<2026.0.0)",
    "chromadb (>=1.0.20,<2.0.0)",
    "joblib (>=1.5.1,<2.0.0)",
    "feedparser (>=6.0.11,<7.0.0)",
    "spacy (>=3.8.7,<4.0.0)",
    "textblob (>=0.19.0,<0.20.0)",
    "whisper (>=1.1.10,<2.0.0)",
    "pytest (>=8.4.1,<9.0.0)",
    "litellm (>=1.76.0,<2.0.0)"
]

[project.scripts]
lptb = "cli.main:looptube"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
